name: scientific validation

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and validation dependencies
        run: python -m pip install -e ".[dev]"
      - name: Unit and identity tests
        run: pytest
      - name: Numerical derivation audit
        run: python scripts/run_derivation_audit.py --outdir build/audit
      - name: Build source and wheel distributions
        run: python -m build

  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install figure dependencies
        run: python -m pip install -e ".[figures,senecio]"
      - name: Reproduce canonical theory figures
        run: python scripts/reproduce_figures.py --outdir build/figures
      - name: Reproduce pedagogical figures
        run: python scripts/make_pedagogical_figures.py --outdir build/figures
      - name: Reproduce cautious descriptive Senecio figure
        run: python analysis/senecio/senecio_figure.py --outfile build/senecio_pair_descriptive.pdf
